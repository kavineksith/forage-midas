# =============================================================================
# .github/workflows/task2.yml
#
# Midas Core — Task 2: Kafka Listener Implementation & Test Runner
#
# What this workflow does:
#   1.  Checks out your forked forage-midas repo
#   2.  Sets up Java 17
#   3.  Auto-discovers the base package and Java source directory
#   4.  Reads the existing Transaction class to learn its amount field
#   5.  Writes KafkaConsumerConfig.java (consumer factory + deserializer)
#   6.  Writes TransactionKafkaListener.java (the @KafkaListener component)
#   7.  Builds the project
#   8.  Runs TaskTwoTests and captures the full output
#   9.  Parses the first four transaction amounts from the log
#   10. Writes task2_answer.md with the amounts + full test log
#   11. Commits all new/modified files back to the branch
#   12. Uploads artefacts and prints a summary to the Actions UI
#
# Triggers: push / PR to main or master, or manual dispatch
# =============================================================================

name: "Midas Task 2 — Kafka Listener & Amounts"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  task-two:
    name: "Implement Kafka listener → Run TaskTwoTests → Record amounts"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Java 17
      # -----------------------------------------------------------------------
      - name: "Set up Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # -----------------------------------------------------------------------
      # 3. Ensure all Task 1 dependencies are present in pom.xml
      #    (idempotent — safe to re-run even if Task 1 workflow already ran)
      # -----------------------------------------------------------------------
      - name: "Ensure required dependencies in pom.xml"
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET

          POM = "pom.xml"
          NS  = "http://maven.apache.org/POM/4.0.0"
          TAG = f"{{{NS}}}"

          ET.register_namespace("", NS)
          tree = ET.parse(POM)
          root = tree.getroot()

          deps_el = root.find(f"{TAG}dependencies")
          if deps_el is None:
              deps_el = ET.SubElement(root, f"{TAG}dependencies")

          existing = {
              el.findtext(f"{TAG}artifactId", "")
              for el in deps_el.findall(f"{TAG}dependency")
          }

          required = [
              dict(groupId="org.springframework.boot",
                   artifactId="spring-boot-starter-data-jpa",  version="3.2.5"),
              dict(groupId="org.springframework.boot",
                   artifactId="spring-boot-starter-web",        version="3.2.5"),
              dict(groupId="org.springframework.kafka",
                   artifactId="spring-kafka",                   version="3.1.4"),
              dict(groupId="com.h2database",
                   artifactId="h2",                             version="2.2.224",
                   scope="runtime"),
              dict(groupId="org.springframework.boot",
                   artifactId="spring-boot-starter-test",       version="3.2.5",
                   scope="test"),
              dict(groupId="org.springframework.kafka",
                   artifactId="spring-kafka-test",              version="3.1.4",
                   scope="test"),
              dict(groupId="org.testcontainers",
                   artifactId="kafka",                          version="1.19.1",
                   scope="test"),
          ]

          for dep in required:
              if dep["artifactId"] not in existing:
                  dep_el = ET.SubElement(deps_el, f"{TAG}dependency")
                  for k, v in dep.items():
                      ET.SubElement(dep_el, f"{TAG}{k}").text = v
                  print(f"  [added] {dep['artifactId']}")
              else:
                  print(f"  [ok]    {dep['artifactId']}")

          tree.write(POM, xml_declaration=True, encoding="UTF-8")
          PYEOF

      # -----------------------------------------------------------------------
      # 4. Ensure kafka-topic is in application.yml
      # -----------------------------------------------------------------------
      - name: "Ensure kafka-topic in application.yml"
        run: |
          APP_YML="src/main/resources/application.yml"
          mkdir -p "$(dirname "$APP_YML")"
          touch "$APP_YML"
          if ! grep -q "kafka-topic" "$APP_YML"; then
            printf '\ngeneral:\n  kafka-topic: trader-updates\n' >> "$APP_YML"
            echo "Added kafka-topic to application.yml"
          fi

      # -----------------------------------------------------------------------
      # 5. Discover package name, source directory, and Transaction.java
      #    All three are needed to write the Kafka classes correctly.
      # -----------------------------------------------------------------------
      - name: "Discover project structure"
        id: discover
        run: |
          python3 << 'PYEOF'
          import os, subprocess, re
          from pathlib import Path

          # ── find the @SpringBootApplication class ──────────────────────────
          result = subprocess.run(
              ["grep", "-rl", "@SpringBootApplication", "src/main/java"],
              capture_output=True, text=True
          )
          main_files = [f for f in result.stdout.strip().splitlines() if f.endswith(".java")]
          if not main_files:
              raise FileNotFoundError("Cannot locate @SpringBootApplication class")

          main_file  = Path(main_files[0])
          java_dir   = main_file.parent
          pkg_line   = next(
              l for l in main_file.read_text().splitlines()
              if l.strip().startswith("package ")
          )
          package = pkg_line.strip().removeprefix("package ").removesuffix(";").strip()

          # ── find Transaction.java ──────────────────────────────────────────
          tx_result = subprocess.run(
              ["find", "src/main/java", "-name", "Transaction.java"],
              capture_output=True, text=True
          )
          tx_files = tx_result.stdout.strip().splitlines()
          tx_file  = Path(tx_files[0]) if tx_files else None

          # ── detect the amount field / getter name ─────────────────────────
          amount_accessor = "getAmount()"   # safe default
          if tx_file and tx_file.exists():
              content = tx_file.read_text()
              # Look for a field whose name contains "amount" (case-insensitive)
              match = re.search(r'private\s+[\w<>]+\s+(\w*[Aa]mount\w*)\s*;', content)
              if match:
                  field = match.group(1)
                  # Derive getter: e.g. amount → getAmount, txAmount → getTxAmount
                  amount_accessor = "get" + field[0].upper() + field[1:] + "()"

          print(f"Package    : {package}")
          print(f"Source dir : {java_dir}")
          print(f"Accessor   : {amount_accessor}")

          # ── write outputs so subsequent steps can use them ────────────────
          env_file = os.environ["GITHUB_OUTPUT"]
          with open(env_file, "a") as f:
              f.write(f"package={package}\n")
              f.write(f"java_dir={java_dir}\n")
              f.write(f"amount_accessor={amount_accessor}\n")
          PYEOF

      # -----------------------------------------------------------------------
      # 6. Write KafkaConsumerConfig.java
      #    Configures a ConsumerFactory with:
      #      - JSON deserialization targeting the Transaction class
      #      - no trust check on type headers (false flag) for test compatibility
      #      - earliest auto-offset-reset so the embedded broker delivers all msgs
      # -----------------------------------------------------------------------
      - name: "Write KafkaConsumerConfig.java"
        env:
          PACKAGE:  ${{ steps.discover.outputs.package }}
          JAVA_DIR: ${{ steps.discover.outputs.java_dir }}
        run: |
          cat > "${JAVA_DIR}/KafkaConsumerConfig.java" << JAVAEOF
          package ${PACKAGE};

          import org.apache.kafka.clients.consumer.ConsumerConfig;
          import org.apache.kafka.common.serialization.StringDeserializer;
          import org.springframework.context.annotation.Bean;
          import org.springframework.context.annotation.Configuration;
          import org.springframework.kafka.config.ConcurrentKafkaListenerContainerFactory;
          import org.springframework.kafka.core.ConsumerFactory;
          import org.springframework.kafka.core.DefaultKafkaConsumerFactory;
          import org.springframework.kafka.support.serializer.JsonDeserializer;

          import java.util.HashMap;
          import java.util.Map;

          @Configuration
          public class KafkaConsumerConfig {

              @Bean
              public ConsumerFactory<String, Transaction> consumerFactory() {
                  Map<String, Object> props = new HashMap<>();
                  props.put(ConsumerConfig.GROUP_ID_CONFIG,           "midas-consumer-group");
                  props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,  "earliest");

                  // false = do not enforce type-header validation (required for test compatibility)
                  JsonDeserializer<Transaction> deserializer =
                          new JsonDeserializer<>(Transaction.class, false);

                  return new DefaultKafkaConsumerFactory<>(
                          props,
                          new StringDeserializer(),
                          deserializer
                  );
              }

              @Bean
              public ConcurrentKafkaListenerContainerFactory<String, Transaction>
              kafkaListenerContainerFactory() {
                  ConcurrentKafkaListenerContainerFactory<String, Transaction> factory =
                          new ConcurrentKafkaListenerContainerFactory<>();
                  factory.setConsumerFactory(consumerFactory());
                  return factory;
              }
          }
          JAVAEOF
          echo "KafkaConsumerConfig.java written to ${JAVA_DIR}"

      # -----------------------------------------------------------------------
      # 7. Write TransactionKafkaListener.java
      #    - @KafkaListener reads the topic name from application.yml property
      #    - Logs each received transaction amount with a distinctive prefix
      #      "MIDAS_AMOUNT:" so we can parse them reliably from the test output
      # -----------------------------------------------------------------------
      - name: "Write TransactionKafkaListener.java"
        env:
          PACKAGE:          ${{ steps.discover.outputs.package }}
          JAVA_DIR:         ${{ steps.discover.outputs.java_dir }}
          AMOUNT_ACCESSOR:  ${{ steps.discover.outputs.amount_accessor }}
        run: |
          cat > "${JAVA_DIR}/TransactionKafkaListener.java" << JAVAEOF
          package ${PACKAGE};

          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.kafka.annotation.KafkaListener;
          import org.springframework.stereotype.Component;

          @Component
          public class TransactionKafkaListener {

              private static final Logger log =
                      LoggerFactory.getLogger(TransactionKafkaListener.class);

              /**
               * Listens on the Kafka topic configured via general.kafka-topic.
               * Deserializes each message to a {@link Transaction} and logs the amount.
               *
               * The topic value is resolved from application.yml at runtime, keeping
               * the listener fully decoupled from the configuration.
               */
              @KafkaListener(
                      topics   = "\${general.kafka-topic}",
                      groupId  = "midas-consumer-group"
              )
              public void listen(Transaction transaction) {
                  log.info("MIDAS_AMOUNT: {}", transaction.${AMOUNT_ACCESSOR});
              }
          }
          JAVAEOF
          echo "TransactionKafkaListener.java written to ${JAVA_DIR}"
          echo ""
          echo "--- Generated listener ---"
          cat "${JAVA_DIR}/TransactionKafkaListener.java"

      # -----------------------------------------------------------------------
      # 8. Build (skip tests — tests run separately for clean output capture)
      # -----------------------------------------------------------------------
      - name: "Maven clean install (skip tests)"
        run: mvn clean install -DskipTests --no-transfer-progress

      # -----------------------------------------------------------------------
      # 9. Run TaskTwoTests — full output goes to test_output_task2.txt
      # -----------------------------------------------------------------------
      - name: "Run TaskTwoTests"
        id: run_tests
        run: |
          mvn -Dtest=TaskTwoTests test --no-transfer-progress \
            2>&1 | tee test_output_task2.txt
        continue-on-error: true

      # -----------------------------------------------------------------------
      # 10. Parse the first four MIDAS_AMOUNT entries and write the answer MD
      # -----------------------------------------------------------------------
      - name: "Parse amounts → write task2_answer.md"
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          raw = Path("test_output_task2.txt").read_text(errors="replace")

          # Extract every "MIDAS_AMOUNT: <value>" line in order
          amounts = re.findall(r"MIDAS_AMOUNT:\s*([\d.,]+)", raw)
          first_four = amounts[:4]

          # ── also check for a BEGIN…END block (Task 2 may include one) ──────
          snippet_match = re.search(r"(BEGIN.*?END)", raw, re.DOTALL)
          snippet = snippet_match.group(1).strip() if snippet_match else None

          # ── build the markdown ─────────────────────────────────────────────
          if first_four:
              amounts_block = "\n".join(
                  f"{i+1}. `{amt}`" for i, amt in enumerate(first_four)
              )
          else:
              amounts_block = (
                  "⚠️  No `MIDAS_AMOUNT` log lines found.\n\n"
                  "Check whether:\n"
                  "- The listener compiled and autowired correctly.\n"
                  "- The `amount` accessor name matches the Transaction field.\n"
                  "- TaskTwoTests actually published messages to the topic."
              )

          snippet_section = ""
          if snippet:
              snippet_section = f"""
          ## BEGIN…END snippet (if present)

          ```
          {snippet}
          ```
          """

          md = f"""\
          # Midas Task 2 — Answer

          ## First four transaction amounts received by Midas Core

          {amounts_block}

          {snippet_section}
          ---

          ## Full test output

          <details>
          <summary>Click to expand</summary>

          ```
          {raw}
          ```

          </details>
          """

          import textwrap
          md = textwrap.dedent(md)
          Path("task2_answer.md").write_text(md)

          print("task2_answer.md written.")
          print(f"\nFirst four amounts found: {first_four or 'NONE — see note above'}")
          PYEOF

      # -----------------------------------------------------------------------
      # 11. Commit all generated files back to the branch
      # -----------------------------------------------------------------------
      - name: "Commit generated files"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml \
                  src/main/resources/application.yml \
                  src/main/java \
                  task2_answer.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "ci: Task 2 — Kafka listener + transaction amounts [skip ci]"
            git push
          fi

      # -----------------------------------------------------------------------
      # 12. Upload artefacts
      # -----------------------------------------------------------------------
      - name: "Upload artefacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "task2-results"
          path: |
            task2_answer.md
            test_output_task2.txt
          retention-days: 30

      # -----------------------------------------------------------------------
      # 13. Print summary to Actions UI
      # -----------------------------------------------------------------------
      - name: "Print summary"
        if: always()
        run: cat task2_answer.md >> "$GITHUB_STEP_SUMMARY"