# =============================================================================
# .github/workflows/task3.yml  (fixed)
#
# Fixes applied vs the previous version:
#   1. Deletes TransactionListener.java (scaffold file with wrong filename)
#      before writing the correct TransactionKafkaListener.java
#   2. Removes duplicate-class risk by cleaning any old listener files first
#   3. DatabaseConduit uses UserRecord directly (no Optional wrapper) because
#      the scaffold UserRepository returns UserRecord, not Optional<UserRecord>
# =============================================================================

name: "Midas Task 3 — H2 Database & waldorf Balance"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  task-three:
    name: "JPA integration → Run TaskThreeTests → Report waldorf balance"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: "Set up Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # ── 3. Ensure pom.xml dependencies (idempotent) ────────────────────────
      - name: "Ensure required dependencies in pom.xml"
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET

          POM = "pom.xml"
          NS  = "http://maven.apache.org/POM/4.0.0"
          TAG = f"{{{NS}}}"
          ET.register_namespace("", NS)

          tree = ET.parse(POM)
          root = tree.getroot()
          deps_el = root.find(f"{TAG}dependencies") or ET.SubElement(root, f"{TAG}dependencies")
          existing = {el.findtext(f"{TAG}artifactId","") for el in deps_el.findall(f"{TAG}dependency")}

          required = [
              dict(groupId="org.springframework.boot",  artifactId="spring-boot-starter-data-jpa", version="3.2.5"),
              dict(groupId="org.springframework.boot",  artifactId="spring-boot-starter-web",       version="3.2.5"),
              dict(groupId="org.springframework.kafka", artifactId="spring-kafka",                  version="3.1.4"),
              dict(groupId="com.h2database",            artifactId="h2",                            version="2.2.224", scope="runtime"),
              dict(groupId="org.springframework.boot",  artifactId="spring-boot-starter-test",      version="3.2.5",   scope="test"),
              dict(groupId="org.springframework.kafka", artifactId="spring-kafka-test",             version="3.1.4",   scope="test"),
              dict(groupId="org.testcontainers",        artifactId="kafka",                         version="1.19.1",  scope="test"),
          ]
          for dep in required:
              if dep["artifactId"] not in existing:
                  el = ET.SubElement(deps_el, f"{TAG}dependency")
                  for k, v in dep.items():
                      ET.SubElement(el, f"{TAG}{k}").text = v
                  print(f"  [added] {dep['artifactId']}")
              else:
                  print(f"  [ok]    {dep['artifactId']}")
          tree.write(POM, xml_declaration=True, encoding="UTF-8")
          PYEOF

      # ── 4. Patch application.yml ───────────────────────────────────────────
      - name: "Write application.yml (H2 + JPA + kafka-topic)"
        run: |
          APP="src/main/resources/application.yml"
          mkdir -p "$(dirname "$APP")"
          cat > "$APP" << 'YMLEOF'
          general:
            kafka-topic: trader-updates

          spring:
            datasource:
              url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
              driver-class-name: org.h2.Driver
              username: sa
              password:
            jpa:
              database-platform: org.hibernate.dialect.H2Dialect
              hibernate:
                ddl-auto: create-drop
              show-sql: false
            h2:
              console:
                enabled: true
                path: /h2-console
          YMLEOF
          # Strip the leading indentation added by the heredoc
          python3 -c "
          import textwrap, pathlib
          p = pathlib.Path('$APP')
          p.write_text(textwrap.dedent(p.read_text()))
          "
          echo "--- application.yml ---"
          cat "$APP"

      # ── 5. Discover project layout ─────────────────────────────────────────
      - name: "Discover package and source directory"
        id: discover
        run: |
          python3 << 'PYEOF'
          import os, subprocess
          from pathlib import Path

          result = subprocess.run(
              ["grep", "-rl", "@SpringBootApplication", "src/main/java"],
              capture_output=True, text=True
          )
          main_file = Path(result.stdout.strip().splitlines()[0])
          java_dir  = main_file.parent

          pkg_line = next(
              l for l in main_file.read_text().splitlines()
              if l.strip().startswith("package ")
          )
          package = pkg_line.strip().removeprefix("package ").removesuffix(";").strip()

          print(f"Package  : {package}")
          print(f"Java dir : {java_dir}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"package={package}\n")
              f.write(f"java_dir={java_dir}\n")
          PYEOF

      # ── 6. FIX: Remove conflicting scaffold listener files ─────────────────
      #
      # The scaffold ships TransactionListener.java which contains a class
      # named TransactionKafkaListener — wrong filename causes:
      #   "class TransactionKafkaListener should be in TransactionKafkaListener.java"
      # We also need to remove any stale Task 2 TransactionKafkaListener.java
      # to avoid the duplicate-class error before we write the correct one.
      - name: "Remove conflicting listener files"
        env:
          JAVA_DIR: ${{ steps.discover.outputs.java_dir }}
        run: |
          COMPONENT="${JAVA_DIR}/component"

          # The scaffold file with the wrong filename
          if [ -f "${COMPONENT}/TransactionListener.java" ]; then
            rm -f "${COMPONENT}/TransactionListener.java"
            echo "Removed TransactionListener.java (wrong filename for class TransactionKafkaListener)"
          fi

          # Any stale Task 2 listener (will be rewritten below)
          if [ -f "${COMPONENT}/TransactionKafkaListener.java" ]; then
            rm -f "${COMPONENT}/TransactionKafkaListener.java"
            echo "Removed old TransactionKafkaListener.java (will rewrite)"
          fi

          echo "Listener cleanup done. Remaining component files:"
          ls -1 "${COMPONENT}/" 2>/dev/null || echo "(empty)"

      # ── 7. Write TransactionRecord.java ───────────────────────────────────
      - name: "Write entity/TransactionRecord.java"
        env:
          PACKAGE:  ${{ steps.discover.outputs.package }}
          JAVA_DIR: ${{ steps.discover.outputs.java_dir }}
        run: |
          mkdir -p "${JAVA_DIR}/entity"
          cat > "${JAVA_DIR}/entity/TransactionRecord.java" << 'JAVAEOF'
          package PLACEHOLDER.entity;

          import jakarta.persistence.*;

          /**
           * Persisted record of a validated financial transaction.
           * Many transactions share the same sender/recipient UserRecord — hence @ManyToOne.
           */
          @Entity
          @Table(name = "transaction_record")
          public class TransactionRecord {

              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private long id;

              @ManyToOne(fetch = FetchType.LAZY, optional = false)
              @JoinColumn(name = "sender_id", nullable = false)
              private UserRecord sender;

              @ManyToOne(fetch = FetchType.LAZY, optional = false)
              @JoinColumn(name = "recipient_id", nullable = false)
              private UserRecord recipient;

              @Column(nullable = false)
              private float amount;

              protected TransactionRecord() {}

              public TransactionRecord(UserRecord sender, UserRecord recipient, float amount) {
                  this.sender    = sender;
                  this.recipient = recipient;
                  this.amount    = amount;
              }

              public long      getId()        { return id; }
              public UserRecord getSender()   { return sender; }
              public UserRecord getRecipient(){ return recipient; }
              public float      getAmount()   { return amount; }
          }
          JAVAEOF
          sed -i "s|PLACEHOLDER|${PACKAGE}|g" "${JAVA_DIR}/entity/TransactionRecord.java"
          echo "TransactionRecord.java written"

      # ── 8. Write TransactionRepository.java ───────────────────────────────
      - name: "Write repository/TransactionRepository.java"
        env:
          PACKAGE:  ${{ steps.discover.outputs.package }}
          JAVA_DIR: ${{ steps.discover.outputs.java_dir }}
        run: |
          mkdir -p "${JAVA_DIR}/repository"
          cat > "${JAVA_DIR}/repository/TransactionRepository.java" << 'JAVAEOF'
          package PLACEHOLDER.repository;

          import PLACEHOLDER.entity.TransactionRecord;
          import org.springframework.data.jpa.repository.JpaRepository;
          import org.springframework.stereotype.Repository;

          @Repository
          public interface TransactionRepository extends JpaRepository<TransactionRecord, Long> {
          }
          JAVAEOF
          sed -i "s|PLACEHOLDER|${PACKAGE}|g" "${JAVA_DIR}/repository/TransactionRepository.java"
          echo "TransactionRepository.java written"

      # ── 9. Write DatabaseConduit.java ──────────────────────────────────────
      #
      # FIX: UserRepository.findById(long) in this scaffold returns UserRecord
      # directly (not Optional<UserRecord>), so we use null checks instead of
      # Optional.isEmpty(). Using Optional here caused the compilation errors:
      #   "incompatible types: UserRecord cannot be converted to Optional<UserRecord>"
      - name: "Write component/DatabaseConduit.java"
        env:
          PACKAGE:  ${{ steps.discover.outputs.package }}
          JAVA_DIR: ${{ steps.discover.outputs.java_dir }}
        run: |
          mkdir -p "${JAVA_DIR}/component"
          cat > "${JAVA_DIR}/component/DatabaseConduit.java" << 'JAVAEOF'
          package PLACEHOLDER.component;

          import PLACEHOLDER.entity.TransactionRecord;
          import PLACEHOLDER.entity.UserRecord;
          import PLACEHOLDER.foundation.Transaction;
          import PLACEHOLDER.repository.TransactionRepository;
          import PLACEHOLDER.repository.UserRepository;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.stereotype.Component;
          import org.springframework.transaction.annotation.Transactional;

          /**
           * Validates and persists financial transactions.
           *
           * Validation rules:
           *  1. senderId must map to a real UserRecord (null check — repo returns UserRecord directly)
           *  2. recipientId must map to a real UserRecord
           *  3. sender.balance >= transaction.amount
           *
           * @Transactional: all three writes (insert + 2 balance updates) are atomic.
           */
          @Component
          public class DatabaseConduit {

              private static final Logger log = LoggerFactory.getLogger(DatabaseConduit.class);

              private final UserRepository        userRepository;
              private final TransactionRepository transactionRepository;

              public DatabaseConduit(UserRepository userRepository,
                                     TransactionRepository transactionRepository) {
                  this.userRepository        = userRepository;
                  this.transactionRepository = transactionRepository;
              }

              @Transactional
              public void process(Transaction transaction) {

                  // Rule 1: sender must exist
                  // NOTE: UserRepository.findById returns UserRecord (not Optional)
                  UserRecord sender = userRepository.findById(transaction.getSenderId());
                  if (sender == null) {
                      log.warn("Discarding — sender {} not found", transaction.getSenderId());
                      return;
                  }

                  // Rule 2: recipient must exist
                  UserRecord recipient = userRepository.findById(transaction.getRecipientId());
                  if (recipient == null) {
                      log.warn("Discarding — recipient {} not found", transaction.getRecipientId());
                      return;
                  }

                  // Rule 3: sender has sufficient balance
                  if (sender.getBalance() < transaction.getAmount()) {
                      log.warn("Discarding — sender {} balance {} < amount {}",
                              sender.getId(), sender.getBalance(), transaction.getAmount());
                      return;
                  }

                  // All valid: persist TransactionRecord and update both balances
                  transactionRepository.save(
                          new TransactionRecord(sender, recipient, transaction.getAmount()));

                  sender.setBalance(sender.getBalance() - transaction.getAmount());
                  recipient.setBalance(recipient.getBalance() + transaction.getAmount());
                  userRepository.save(sender);
                  userRepository.save(recipient);

                  // Log both sides so the CI parser can find waldorf regardless of role
                  log.info("WALDORF_BALANCE_CHECK: user={} balance={}", sender.getName(),    sender.getBalance());
                  log.info("WALDORF_BALANCE_CHECK: user={} balance={}", recipient.getName(), recipient.getBalance());
              }
          }
          JAVAEOF
          sed -i "s|PLACEHOLDER|${PACKAGE}|g" "${JAVA_DIR}/component/DatabaseConduit.java"
          echo "DatabaseConduit.java written"

      # ── 10. Write TransactionKafkaListener.java ────────────────────────────
      #
      # FIX: Written fresh after the old conflicting files were deleted in step 6.
      # Only one file, correct name, correct class name — no more duplicate error.
      - name: "Write component/TransactionKafkaListener.java"
        env:
          PACKAGE:  ${{ steps.discover.outputs.package }}
          JAVA_DIR: ${{ steps.discover.outputs.java_dir }}
        run: |
          cat > "${JAVA_DIR}/component/TransactionKafkaListener.java" << 'JAVAEOF'
          package PLACEHOLDER.component;

          import PLACEHOLDER.foundation.Transaction;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.kafka.annotation.KafkaListener;
          import org.springframework.stereotype.Component;

          /**
           * Kafka consumer — receives Transaction DTOs from the trader-updates topic
           * and delegates to DatabaseConduit for validation and persistence.
           */
          @Component
          public class TransactionKafkaListener {

              private static final Logger log =
                      LoggerFactory.getLogger(TransactionKafkaListener.class);

              private final DatabaseConduit databaseConduit;

              public TransactionKafkaListener(DatabaseConduit databaseConduit) {
                  this.databaseConduit = databaseConduit;
              }

              @KafkaListener(
                      topics  = "${general.kafka-topic}",
                      groupId = "midas-consumer-group"
              )
              public void listen(Transaction transaction) {
                  log.info("MIDAS_AMOUNT: {}", transaction.getAmount());
                  databaseConduit.process(transaction);
              }
          }
          JAVAEOF
          sed -i "s|PLACEHOLDER|${PACKAGE}|g" "${JAVA_DIR}/component/TransactionKafkaListener.java"
          echo "TransactionKafkaListener.java written"
          echo ""
          echo "=== Final component/ contents ==="
          ls -1 "${JAVA_DIR}/component/"

      # ── 11. Build ──────────────────────────────────────────────────────────
      - name: "Maven clean install (skip tests)"
        run: mvn clean install -DskipTests --no-transfer-progress

      # ── 12. Run TaskThreeTests ─────────────────────────────────────────────
      - name: "Run TaskThreeTests"
        run: |
          mvn -Dtest=TaskThreeTests test --no-transfer-progress \
            2>&1 | tee test_output_task3.txt
        continue-on-error: true

      # ── 13. Parse waldorf balance → task3_answer.md ────────────────────────
      - name: "Parse waldorf balance → task3_answer.md"
        run: |
          python3 << 'PYEOF'
          import re, math, textwrap
          from pathlib import Path

          raw = Path("test_output_task3.txt").read_text(errors="replace")

          # Strategy 1: our custom WALDORF_BALANCE_CHECK log lines
          waldorf_hits = re.findall(
              r"WALDORF_BALANCE_CHECK:\s*user=waldorf\s+balance=([\d.]+)", raw
          )
          final_raw = waldorf_hits[-1] if waldorf_hits else None

          # Strategy 2: generic pattern (user waldorf, any log format)
          if not final_raw:
              hits = re.findall(
                  r"(?i)waldorf[^\d]*([\d.]+)", raw
              )
              final_raw = hits[-1] if hits else None

          # Strategy 3: BEGIN…END snippet
          snippet_m = re.search(r"(BEGIN.*?END)", raw, re.DOTALL)
          snippet   = snippet_m.group(1).strip() if snippet_m else None
          if snippet and not final_raw:
              hits = re.findall(r"(?i)waldorf[^\d]*([\d.]+)", snippet)
              final_raw = hits[-1] if hits else None

          if final_raw:
              val = float(final_raw)
              floored = math.floor(val)
              answer_block = f"""
          ### waldorf's final balance

          | | Value |
          |---|---|
          | Raw (float) | `{val}` |
          | **Rounded down (floor)** | **`{floored}`** |

          > ✅ **Submit this value: `{floored}`**
          """
          else:
              floored = "?"
              answer_block = """
          ⚠️  Could not automatically parse waldorf's balance.
          Open `test_output_task3.txt` from the artefacts, search for `waldorf`,
          find the last balance value, and floor it to the nearest integer.
          """

          snippet_section = f"""
          ## BEGIN…END snippet

          ```
          {snippet}
          ```
          """ if snippet else ""

          md = f"""# Midas Task 3 — Answer

          ## waldorf's balance after all transactions

          {answer_block}

          {snippet_section}
          ---

          ## Files created / modified

          | File | Path | Action |
          |------|------|--------|
          | `TransactionRecord.java` | `entity/` | Created — JPA entity |
          | `TransactionRepository.java` | `repository/` | Created — Spring Data repo |
          | `DatabaseConduit.java` | `component/` | Written — validation + persistence |
          | `TransactionKafkaListener.java` | `component/` | Rewritten — wires DatabaseConduit |
          | `application.yml` | `src/main/resources/` | Updated — H2 + JPA config |
          | `TransactionListener.java` | `component/` | **Deleted** — wrong filename for class |

          ---

          ## Full test output

          <details>
          <summary>Click to expand</summary>

          ```
          {raw}
          ```

          </details>
          """

          Path("task3_answer.md").write_text(textwrap.dedent(md))
          print("task3_answer.md written")
          print(f"waldorf balance → {final_raw}  (floor = {floored})")
          PYEOF

      # ── 14. Commit ─────────────────────────────────────────────────────────
      - name: "Commit generated files"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml \
                  src/main/resources/application.yml \
                  src/main/java \
                  task3_answer.md 2>/dev/null || true
          # Stage deletions (TransactionListener.java)
          git add -u src/main/java 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "ci: Task 3 — fix listener conflict + JPA integration [skip ci]"
            git push
          fi

      # ── 15. Upload artefacts ───────────────────────────────────────────────
      - name: "Upload artefacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "task3-results"
          path: |
            task3_answer.md
            test_output_task3.txt
          retention-days: 30

      # ── 16. Actions job summary ────────────────────────────────────────────
      - name: "Print summary"
        if: always()
        run: cat task3_answer.md >> "$GITHUB_STEP_SUMMARY"