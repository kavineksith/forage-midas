general:
  kafka-topic: trader-updates

spring:
  datasource:
    url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop      # creates schema on startup, drops on shutdown
    show-sql: false              # set true to see SQL in logs while debugging
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true              # browse http://localhost:8080/h2-console during dev
      path: /h2-console